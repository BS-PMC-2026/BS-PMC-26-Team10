name: CI
on:
  push:
    branches:
      - main
jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Run frontend unit tests
        run: npm run test:run
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r Backend/requirements.txt
      - name: Validate backend syntax
        run: python -m compileall Backend/main.py Backend/app Backend/db/scripts
      - name: Run backend unit tests
        working-directory: Backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m unittest discover -s tests -v
  integration:
    name: Integration Tests
    needs: [backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r Backend/requirements.txt -r integration_tests/requirements.txt
      - name: Run integration tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m pytest integration_tests/ -v
  build-artifact:
    name: Build & Upload Artifact
    needs: [frontend, backend, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci
      - name: Build frontend
        working-directory: Frontend
        run: npm run build
      - name: Zip bundle
        run: zip -r chilliland-${{ github.sha }}.zip Frontend/dist/ Backend/
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chilliland-${{ github.run_number }}-${{ github.sha }}
          path: chilliland-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14
  deploy-frontend:
    name: Deploy Frontend to Azure
    needs: [build-artifact]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci
      - name: Build frontend
        working-directory: Frontend
        run: npm run build
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ChilliLand
          publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
          package: ./Frontend/dist
  deploy-backend:
    name: Deploy Backend to Azure
    needs: [build-artifact]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: Chillieland-backend
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          package: ./Backend
