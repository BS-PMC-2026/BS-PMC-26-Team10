<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChiliLand</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/auth.css">
</head>

<body>

<div class="page">

  <div class="box">

    <!-- LEFT SIDE -->
    <div class="left">
      <h1 class="title">ChiliLand</h1>
      <p class="subtitle">Farm Platform</p>

      <div class="tabs">
        <button id="loginTab" class="tab active">Login</button>
        <button id="signupTab" class="tab">Sign Up</button>
      </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right">

      <!-- LOGIN -->
      <div id="login" class="form active">

        <h2>Login</h2>

        <input type="email" placeholder="Email" id="loginEmail">
        <input type="password" placeholder="Password" id="loginPassword">

        <button id="loginBtn">Login</button>

        <p class="switch">
          Don’t have an account?
          <span id="goSignup">Sign Up</span>
        </p>

      </div>

      <!-- SIGNUP -->
      <div id="signup" class="form">

        <h2>Sign Up</h2>

        <input type="text" placeholder="Full Name" id="name">
        <input type="email" placeholder="Email" id="email">
        <input type="password" placeholder="Password" id="password">

        <!-- ROLE -->
        <select id="role">
          <option value="visitor">Visitor</option>
          <option value="worker">Worker</option>
          <option value="admin">Admin</option>
        </select>

        <button id="signupBtn">Create Account</button>

        <button id="guestBtn" class="guest">Continue as Guest</button>

        <p class="switch">
          Already have an account?
          <span id="goLogin">Login</span>
        </p>

      </div>

    </div>

  </div>

</div>

<script src="js/auth.js"></script>

</body>
</html>
