<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/VisitorMain.css">
    <title>Visitor Main</title>
</head>
<body>

    <header class="topbar">
        <div class="logo">ChiliLand</div>
        <nav class="tabs">
            <a href="#" class="tab active">Catalogue</a>
            <a href="#" class="tab">Book Visit</a>
            <a href="#" class="tab">More</a>
        </nav>
    </header>

    <main class="main-content">
        <section class="hero">
            <h1>Welcome to ChiliLand</h1>
            <p>Explore our pepper catalogue, book a visit, and discover more.</p>
        </section>

        <section class="catalogue-section">
            <h2>Catalogue</h2>
            <form class="search-panel" id="searchForm" role="search">
                <label class="search-label" for="searchInput">Find a pepper</label>
                <div class="search-bar">
                    <input type="search" id="searchInput" placeholder="Search peppers by name or description..." autocomplete="off">
                    <button type="button" id="clearSearchButton" class="secondary-button" aria-label="Clear search">Clear</button>
                    <button type="submit" id="searchButton">Search</button>
                </div>
                <p id="searchStatus" class="search-status" aria-live="polite">Showing all peppers.</p>
            </form>
            <div id="chilliContainer" class="chilli-grid"></div>
        </section>
    </main>

    <script src="../js/VisitorMain.js"></script>
</body>
</html>
